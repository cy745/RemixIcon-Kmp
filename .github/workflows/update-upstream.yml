name: Check Upstream RemixIcon Release

on:
  schedule:
    # Run weekly on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific upstream tag to update to (e.g. v4.9.1). Leave empty for latest.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    name: Check & Update
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest upstream release tag
        id: upstream
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(gh api repos/Remix-Design/RemixIcon/releases/latest --jq '.tag_name')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # Get the commit SHA for this tag
          SHA=$(gh api repos/Remix-Design/RemixIcon/git/ref/tags/$TAG --jq '.object.sha')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print versions
        run: |
          echo "Current submodule: $(git submodule status RemixIcon | awk '{print $1}')"
          echo "Upstream tag:      ${{ steps.upstream.outputs.tag }}"
          echo "Upstream sha:      ${{ steps.upstream.outputs.sha }}"

      - name: Check if update needed
        id: check
        run: |
          CURRENT_SHA=$(git submodule status RemixIcon | awk '{print $1}' | sed 's/^[-+]//')
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"

          if [ "$CURRENT_SHA" = "$UPSTREAM_SHA" ]; then
            echo "need_update=false" >> $GITHUB_OUTPUT
            echo "Already at latest upstream (${{ steps.upstream.outputs.tag }})"
          else
            echo "need_update=true" >> $GITHUB_OUTPUT
            echo "Upstream ${{ steps.upstream.outputs.tag }} available"
          fi

      - name: Update submodule & regenerate
        if: steps.check.outputs.need_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update submodule to the release tag
          cd RemixIcon
          git fetch origin tag ${{ steps.upstream.outputs.tag }} --depth=1
          git checkout ${{ steps.upstream.outputs.tag }}
          cd ..

          # Commit submodule update
          git add RemixIcon
          git commit -m "chore: update RemixIcon submodule to ${{ steps.upstream.outputs.tag }}"

          # Regenerate icons & wrapper
          ./gradlew :svg-to-compose:transformSvgIcons

      - name: Create Pull Request
        if: steps.check.outputs.need_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update icons to RemixIcon ${{ steps.upstream.outputs.tag }}"
          title: "🎨 Update icons to RemixIcon ${{ steps.upstream.outputs.tag }}"
          body: |
            Auto-generated PR by the upstream update workflow.

            **Upstream tag:** `${{ steps.upstream.outputs.tag }}`

            Changes:
            - Update RemixIcon submodule to ${{ steps.upstream.outputs.tag }}
            - Regenerate all 3058+ drawable resources
            - Update RemixIcon.kt wrapper

            After merge, publish a new version with:
            ```
            git tag v0.0.x
            git push origin v0.0.x
            ```
          branch: update-upstream-${{ steps.upstream.outputs.tag }}
          base: master
          labels: dependencies,automated
